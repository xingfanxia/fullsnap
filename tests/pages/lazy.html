<!doctype html>
<title>Page that grows as it is scrolled</title>
<style>body { margin: 0; background: rgb(250, 250, 250); } .band { height: 500px; }</style>
<div class="band" style="background: rgb(10, 120, 10)"></div>
<div class="band" style="background: rgb(20, 20, 160)"></div>
<div id="more"></div>
<script>
	// Two more bands are appended the first time the bottom comes into view, as lazily loaded sections do.
	const colours = ['rgb(160, 120, 20)', 'rgb(120, 20, 120)'];
	addEventListener('scroll', () => {
		if (colours.length && scrollY + innerHeight >= document.documentElement.scrollHeight - 10) {
			const band = document.createElement('div');
			band.className = 'band';
			band.style.background = colours.shift();
			document.getElementById('more').append(band);
		}
	});
</script>
