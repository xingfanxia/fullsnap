<!doctype html>
<title>App with an inner scrolling pane</title>
<style>
	html, body { margin: 0; height: 100%; overflow: hidden; background: rgb(250, 250, 250); }
	.top { height: 50px; background: rgb(200, 0, 0); }
	.shell { display: flex; height: calc(100% - 50px); }
	.side { width: 160px; background: rgb(40, 40, 40); }
	.pane { flex: 1; overflow-y: auto; }
	.band { height: 500px; }
</style>
<div class="top"></div>
<div class="shell">
	<div class="side"></div>
	<div class="pane">
		<div class="band" style="background: rgb(10, 120, 10)"></div>
		<div class="band" style="background: rgb(20, 20, 160)"></div>
		<div class="band" style="background: rgb(160, 120, 20)"></div>
		<div class="band" style="background: rgb(120, 20, 120)"></div>
	</div>
</div>
